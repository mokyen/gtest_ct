name: CTest Complex Matrix Build

on:
  push:
    branches:
      - '*'       # Trigger on pushes to any branch
    # Optionally restrict to paths, for example:
    # paths:
    #   - 'src/**'
    #   - 'include/**'
    #   - 'test/**'
  pull_request:
    branches:
      - '*'       # Trigger on PRs targeting any branch

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [g++, clang++]
        cpp_standard: [11, 14, 17, 20, 23]
        include:
          # C++11 -> GoogleTest release-1.12.1 (last C++11-compatible)
          - compiler: g++
            cpp_standard: 11
            gtest_ref: release-1.12.1
          - compiler: clang++
            cpp_standard: 11
            gtest_ref: release-1.12.1
          # C++14 -> GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 14
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 14
            gtest_ref: v1.14.0
          # C++17 -> GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 17
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 17
            gtest_ref: v1.14.0
          # C++20 -> GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 20
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 20
            gtest_ref: v1.14.0
          # C++23 -> GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 23
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 23
            gtest_ref: v1.14.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler (if needed)
        run: |
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Install clang-tidy
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-tidy

      - name: Clone GoogleTest (${{ matrix.gtest_ref }})
        run: |
          git clone https://github.com/google/googletest.git -b ${{ matrix.gtest_ref }} googletest

      - name: Build and Install GoogleTest Locally (no sudo prefix on install)
        run: |
          GT_BUILD_CXX_STANDARD="${{ matrix.cpp_standard }}"
          if [ "${{ matrix.gtest_ref }}" = "release-1.12.1" ]; then
            GT_BUILD_CXX_STANDARD="17"
          fi

          cmake -S googletest \
                -B googletest/build \
                -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
                -DCMAKE_CXX_STANDARD="$GT_BUILD_CXX_STANDARD" \
                -DCMAKE_INSTALL_PREFIX="$HOME/gtest_install"

          cmake --build googletest/build
          cmake --install googletest/build --prefix "$HOME/gtest_install"
          echo "Installed GoogleTest under $HOME/gtest_install"

      - name: Configure and Build Project (with C++ ${{ matrix.cpp_standard }} on ${{ matrix.compiler }})
        run: |
          cmake -S . -B build \
                -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
                -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
                -DCMAKE_PREFIX_PATH="$HOME/gtest_install" \
                -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin \
                -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

          cmake --build build --verbose
          echo "Finished building project with ${{ matrix.compiler }} and C++${{ matrix.cpp_standard }}"

      # - name: Run clang-tidy analysis on passing tests file
      #   run: |
      #     echo "Analyzing representative file: test/passing_tests/passing_tests.cpp"
      #     # Use -header-filter to skip third-party code (e.g. googletest or gtest) completely.
      #     clang-tidy test/passing_tests/passing_tests.cpp -p build -header-filter='^(?!.*\/googletest\/).*$' || true
      
      - name: Run clang-tidy analysis
        run: |
          echo "Analyzing library header and test files..."
          FILES_TO_CHECK=(
            "include/gtest_ct.h"
            "test/passing_tests/passing_tests.cpp"
          )
          
          for file in "${FILES_TO_CHECK[@]}"; do
            echo "Analyzing $file..."
            clang-tidy "$file" \
              -p build \
              -header-filter='^(?!.*\/googletest\/).*$' \
              -- \
              -std=c++${{ matrix.cpp_standard }} \
              -I"$HOME/gtest_install/include" \
              -I"include" || true
          done

      - name: Show CTest test list
        run: |
          cd build
          ctest -N

      - name: Run All Tests via CTest
        run: |
          cd build
          ctest --output-on-failure -V -E "compilefail" || exit 1
