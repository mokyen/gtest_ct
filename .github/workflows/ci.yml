name: C++ Build Matrix

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build Matrix
    runs-on: ubuntu-22.04

    strategy:
      matrix:
        include:
          - std: 17
            compiler: g++
            version: 10

          - std: 20
            compiler: g++
            version: 13

          - std: 23
            compiler: clang++
            version: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y software-properties-common

          if [[ "${{ matrix.compiler }}" == "g++" ]]; then
            sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
            sudo apt-get update
            sudo apt-get install -y g++-${{ matrix.version }}
            echo "CXX=g++-${{ matrix.version }}" >> $GITHUB_ENV

          else
            # Install Clang-20 from LLVM repo
            curl -sSL https://apt.llvm.org/llvm-snapshot.gpg.key \
              | gpg --dearmor | sudo tee /usr/share/keyrings/llvm-snapshot.gpg > /dev/null

            echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" \
              | sudo tee /etc/apt/sources.list.d/llvm-jammy-20.list

            sudo apt-get update
            sudo apt-get install -y clang-20
            echo "CXX=clang++-20" >> $GITHUB_ENV
          fi

      - name: Configure
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_CXX_COMPILER=${CXX} -DCMAKE_CXX_STANDARD=${{ matrix.std }} -Dcompile_fail_force_std=${{ matrix.std }}

      - name: Build
        run: |
          cd build
          cmake --build .
