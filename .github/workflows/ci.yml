name: CTest Complex Matrix Build

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # C++11 with gtest 1.12.1
          - compiler: g++
            compiler_version: 7
            cpp_standard: 11
            gtest_ref: release-1.12.1
          - compiler: clang++
            compiler_version: 6
            cpp_standard: 11
            gtest_ref: release-1.12.1

          # C++14 with gtest 1.14.0
          - compiler: g++
            compiler_version: 8
            cpp_standard: 14
            gtest_ref: v1.14.0
          - compiler: clang++
            compiler_version: 7
            cpp_standard: 14
            gtest_ref: v1.14.0

          # C++17 with gtest main
          - compiler: g++
            compiler_version: 9
            cpp_standard: 17
            gtest_ref: main
          - compiler: clang++
            compiler_version: 10
            cpp_standard: 17
            gtest_ref: main

          # C++20 with gtest main
          - compiler: g++
            compiler_version: 10
            cpp_standard: 20
            gtest_ref: main
          - compiler: clang++
            compiler_version: 12
            cpp_standard: 20
            gtest_ref: main

          # C++23 with gtest main
          - compiler: g++
            compiler_version: 13
            cpp_standard: 23
            gtest_ref: main
          - compiler: clang++
            compiler_version: 16
            cpp_standard: 23
            gtest_ref: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add PPAs for older compilers
        run: |
          sudo apt-get update

          # Ubuntu Toolchain PPA for older GCCs (7, 8, 9, 10, 13)
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test

          # LLVM’s official repos for various Clang versions
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key | sudo apt-key add -
          for ver in 6.0 7 10 12 16; do
            sudo add-apt-repository -y "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-${ver} main"
          done

          sudo apt-get update

      - name: Install specific compiler version
        run: |
          if [[ "${{ matrix.compiler }}" == "g++" ]]; then
            sudo apt-get install -y g++-${{ matrix.compiler_version }}
            echo "CXX=g++-${{ matrix.compiler_version }}" >> $GITHUB_ENV
          else
            sudo apt-get install -y clang-${{ matrix.compiler_version }}
            echo "CXX=clang++-${{ matrix.compiler_version }}" >> $GITHUB_ENV
          fi

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Clone GoogleTest (${{ matrix.gtest_ref }})
        run: |
          git clone https://github.com/google/googletest.git -b ${{ matrix.gtest_ref }} googletest

      - name: Build and Install GoogleTest Locally
        run: |
          # For GTest 1.12.1 we build with C++17; otherwise use the matrix standard
          GT_BUILD_CXX_STANDARD="${{ matrix.cpp_standard }}"
          if [ "${{ matrix.gtest_ref }}" = "release-1.12.1" ]; then
            GT_BUILD_CXX_STANDARD="17"
          fi

          cmake -S googletest -B googletest/build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD="$GT_BUILD_CXX_STANDARD" \
            -DCMAKE_INSTALL_PREFIX="$HOME/gtest_install"

          cmake --build googletest/build
          cmake --install googletest/build
          echo "Installed GoogleTest under $HOME/gtest_install"

      - name: Configure and Build Project (C++${{ matrix.cpp_standard }} with $CXX)
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
            -DCMAKE_PREFIX_PATH="$HOME/gtest_install" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Dgtest_ct_build_tests=ON

          cmake --build build --verbose
          echo "Finished building project with $CXX and C++${{ matrix.cpp_standard }}"

      - name: Run clang-tidy analysis
        run: |
          echo "Analyzing library header and test files..."
          FILES_TO_CHECK=(
            "include/gtest_ct.h"
            "test/passing_tests/passing_tests.cpp"
          )

          for file in "${FILES_TO_CHECK[@]}"; do
            echo "Analyzing $file..."
            clang-tidy "$file" \
              -p build \
              -header-filter='^(?!.*\/googletest\/).*$' \
              -- \
              -std=c++${{ matrix.cpp_standard }} \
              -I"$HOME/gtest_install/include" \
              -I"include" || true
          done

      - name: Show CTest test list
        run: |
          cd build
          ctest -N

      - name: Run All Tests via CTest
        run: |
          cd build
          ctest --output-on-failure -V -E "compilefail" || exit 1