name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest # Use the latest Ubuntu image

    strategy:
      matrix:
        # Define the compilers and C++ standards to test
        compiler: [g++, clang++]
        cpp_standard: [11, 14, 17, 20, 23]
        # You can add includes for specific combinations if needed,
        # or excludes if some combinations are not supported/desired.
        # For example, to only test clang with newer standards:
        # include:
        #   - compiler: clang++
        #     cpp_standard: 20
        #   - compiler: clang++
        #     cpp_standard: 23
        # Exclude specific combinations if necessary
        # exclude:
        #   - compiler: g++
        #     cpp_standard: 11 # Example: if your code specifically requires C++20 features used by g++
        #   - compiler: clang++
        #     cpp_standard: 11 # Example: if your constexpr_strcmp has C++20 features needed by clang

      # Fail the entire matrix if any configuration fails
      fail-fast: false

    name: ${{ matrix.compiler }} C++${{ matrix.cpp_standard }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up CMake
      uses: lukka/get-cmake@latest
      with:
        cmakeVersion: '3.17.1' # Or a later version if needed

    - name: Install dependencies
      run: |
        sudo apt-get update
        # Install the selected compiler and necessary standard library
        if [ "${{ matrix.compiler }}" = "g++" ]; then
          sudo apt-get install -y g++
        elif [ "${{ matrix.compiler }}" = "clang++" ]; then
          sudo apt-get install -y clang libc++-dev
        fi

    - name: Build and Install GoogleTest
      run: |
        git clone https://github.com/google/googletest.git -b release-1.12.1
        cd googletest
        # Build GTest with the current matrix compiler and standard
        cmake -Bbuild \
              -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
              -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
              -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
              -DCMAKE_CXX_STANDARD_REQUIRED=ON
        cmake --build build --config Release
        sudo cmake --build build --target install
        cd ..

    - name: Configure CMake
      working-directory: ${{ github.workspace }}
      run: |
        # Configure your project with the current matrix compiler and standard
        # Added -Wdev --warn-uninitialized for verbose output
        cmake -S . -B build \
              -Dgtest_ct_build_tests=ON \
              -DCMAKE_CXX_COMPILER=${{ matrix.compiler }} \
              -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
              -DCMAKE_CXX_STANDARD_REQUIRED=ON \
              -Wdev --warn-uninitialized # Add these flags for verbose output

    - name: Build
      run: cmake --build build

    - name: Run Tests
      run: ctest --test-dir build --output-on-failure
