name: CTest Complex Matrix Build

on:
  workflow_dispatch:
  pull_request:
    branches:
      - '*'

jobs:
  build:
    # Pick runner based on the matrix.os field
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # GCC jobs run on Ubuntu 20.04
          - os: ubuntu-20.04
            compiler: g++
            compiler_version: 7
            cpp_standard: 11
            gtest_ref: release-1.12.1

          - os: ubuntu-20.04
            compiler: g++
            compiler_version: 8
            cpp_standard: 14
            gtest_ref: v1.14.0

          - os: ubuntu-20.04
            compiler: g++
            compiler_version: 9
            cpp_standard: 17
            gtest_ref: main

          - os: ubuntu-20.04
            compiler: g++
            compiler_version: 10
            cpp_standard: 20
            gtest_ref: main

          - os: ubuntu-20.04
            compiler: g++
            compiler_version: 13
            cpp_standard: 23
            gtest_ref: main

          # Clang jobs run on Ubuntu latest
          - os: ubuntu-latest
            compiler: clang++
            cpp_standard: 11
            gtest_ref: release-1.12.1

          - os: ubuntu-latest
            compiler: clang++
            cpp_standard: 14
            gtest_ref: v1.14.0

          - os: ubuntu-latest
            compiler: clang++
            cpp_standard: 17
            gtest_ref: main

          - os: ubuntu-latest
            compiler: clang++
            cpp_standard: 20
            gtest_ref: main

          - os: ubuntu-latest
            compiler: clang++
            cpp_standard: 23
            gtest_ref: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Only GCC jobs need the toolchain PPA
      - name: Add PPA for older GCCs
        if: matrix.compiler == 'g++'
        run: |
          sudo apt-get update
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update

      - name: Install specific compiler version
        run: |
          if [[ "${{ matrix.compiler }}" == "g++" ]]; then
            # All GCC jobs (on Ubuntu 20.04)
            sudo apt-get install -y g++-${{ matrix.compiler_version }}
            echo "CXX=g++-${{ matrix.compiler_version }}" >> $GITHUB_ENV

          else
            # Clang jobs (on ubuntu-latest)
            if [[ "${{ matrix.cpp_standard }}" == "23" ]]; then
              # C++23 → install Clang-20 via Jammy repo
              curl -sSL https://apt.llvm.org/llvm-snapshot.gpg.key \
                | sudo gpg --dearmor -o /usr/share/keyrings/llvm-snapshot.gpg
              echo "deb [signed-by=/usr/share/keyrings/llvm-snapshot.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main" \
                | sudo tee /etc/apt/sources.list.d/llvm-jammy-20.list
              sudo apt-get update
              sudo apt-get install -y clang-20
              echo "CXX=clang++-20" >> $GITHUB_ENV

            else
              # All other Clang jobs use distro clang (v16)
              sudo apt-get update
              sudo apt-get install -y clang
              echo "CXX=clang++" >> $GITHUB_ENV
            fi
          fi

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Clone GoogleTest (${{ matrix.gtest_ref }})
        run: |
          git clone https://github.com/google/googletest.git \
            -b ${{ matrix.gtest_ref }} googletest

      - name: Build and Install GoogleTest Locally
        run: |
          # GTest 1.12.1 needs C++17 to build; others follow the matrix standard
          GT_BUILD_CXX_STANDARD="${{ matrix.cpp_standard }}"
          if [[ "${{ matrix.gtest_ref }}" == "release-1.12.1" ]]; then
            GT_BUILD_CXX_STANDARD="17"
          fi

          cmake -S googletest -B googletest/build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD="$GT_BUILD_CXX_STANDARD" \
            -DCMAKE_INSTALL_PREFIX="$HOME/gtest_install"

          cmake --build googletest/build
          cmake --install googletest/build
          echo "Installed GoogleTest under $HOME/gtest_install"

      - name: Configure and Build Project
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
            -DCMAKE_PREFIX_PATH="$HOME/gtest_install" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Dgtest_ct_build_tests=ON

          cmake --build build --verbose

      - name: Run clang-tidy analysis
        run: |
          for file in include/gtest_ct.h test/passing_tests/passing_tests.cpp; do
            clang-tidy "$file" -p build \
              -header-filter='^(?!.*\/googletest\/).*$' \
              -- -std=c++${{ matrix.cpp_standard }} \
                 -I"$HOME/gtest_install/include" \
                 -I"include" || true
          done

      - name: Show CTest test list
        run: cd build && ctest -N

      - name: Run All Tests via CTest
        run: cd build && ctest --output-on-failure -V -E "compilefail"
