name: CTest Complex Matrix Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest # Or your preferred runner environment

    strategy:
      matrix:
        # Define the C++ standards you want to test
        cpp_standard: [11, 14, 17, 20, 23]
        # This variable will be populated by the 'include' block below
        gtest_ref: [] 

        include:
          # C++11 builds will use Google Test 1.12.1
          - cpp_standard: 11
            gtest_ref: release-1.12.1

          # C++14, 17, 20, 23 builds will use Google Test 1.14.0
          # This version requires C++14+ and is compatible with C++17/20/23 compilers.
          - cpp_standard: 14
            gtest_ref: release-1.14.0
          - cpp_standard: 17
            gtest_ref: release-1.14.0
          - cpp_standard: 20
            gtest_ref: release-1.14.0
          - cpp_standard: 23
            gtest_ref: release-1.14.0
          # If you truly want the absolute latest for C++17/20/23 (less stable):
          # - cpp_standard: 17
          #   gtest_ref: main
          # - cpp_standard: 20
          #   gtest_ref: main
          # - cpp_standard: 23
          #   gtest_ref: main

    steps:
      - uses: actions/checkout@v4 # Checks out your repository code

      - name: Clone Google Test ${{ matrix.gtest_ref }}
        run: git clone https://github.com/google/googletest.git -b ${{ matrix.gtest_ref }} googletest

      - name: Build Google Test (for C++ ${{ matrix.cpp_standard }})
        run: |
          # Determine the C++ standard to use for building Google Test itself.
          # Older Google Test versions (like 1.12.1) don't understand '20' or '23'
          # when passed as CMAKE_CXX_STANDARD. Newer versions (1.14.0+) do.
          GT_BUILD_CXX_STANDARD="${{ matrix.cpp_standard }}"
          if [ "${{ matrix.gtest_ref }}" == "release-1.12.1" ]; then
            GT_BUILD_CXX_STANDARD="17" # Build GT 1.12.1 with C++17 for compatibility
          fi

          # Configure and build Google Test
          cmake -S googletest -B googletest/build -DCMAKE_CXX_STANDARD=$GT_BUILD_CXX_STANDARD
          cmake --build googletest/build

      - name: Configure and Build Project (with C++ ${{ matrix.cpp_standard }})
        run: |
          # Compile your project's code with the matrix-specified C++ standard
          cmake -S . -B build -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin
          cmake --build build

      - name: Run Tests (for C++ ${{ matrix.cpp_standard }})
        run: ./bin/passing_tests