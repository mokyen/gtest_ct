name: CTest Complex Matrix Build

on:
  # Manual trigger via GitHub UI
  workflow_dispatch:

  # Automatic on pull requests
  pull_request:
    branches:
      - '*'

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          # C++11 with gtest 1.12.1
          - compiler: g++
            compiler_version: 7
            cpp_standard: 11
            gtest_ref: release-1.12.1
          - compiler: clang++
            cpp_standard: 11
            gtest_ref: release-1.12.1

          # C++14 with gtest 1.14.0
          - compiler: g++
            compiler_version: 8
            cpp_standard: 14
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 14
            gtest_ref: v1.14.0

          # C++17 with gtest main
          - compiler: g++
            compiler_version: 9
            cpp_standard: 17
            gtest_ref: main
          - compiler: clang++
            cpp_standard: 17
            gtest_ref: main

          # C++20 with gtest main
          - compiler: g++
            compiler_version: 10
            cpp_standard: 20
            gtest_ref: main
          - compiler: clang++
            cpp_standard: 20
            gtest_ref: main

          # C++23 with gtest main
          - compiler: g++
            compiler_version: 13
            cpp_standard: 23
            gtest_ref: main
          - compiler: clang++
            cpp_standard: 23
            gtest_ref: main

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Add PPAs for older GCCs and Clang-20
        run: |
          sudo apt-get update
          # GCC versions 7,8,9,10,13
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          # LLVM apt key
          wget -qO - https://apt.llvm.org/llvm-snapshot.gpg.key \
            | sudo tee /etc/apt/trusted.gpg.d/llvm-snapshot.gpg > /dev/null
          # Jammy (22.04) repo for clang-20
          sudo add-apt-repository -y \
            "deb http://apt.llvm.org/jammy/ llvm-toolchain-jammy-20 main"
          sudo apt-get update

      - name: Install specific compiler version
        run: |
          if [[ "${{ matrix.compiler }}" == "g++" ]]; then
            sudo apt-get install -y g++-${{ matrix.compiler_version }}
            echo "CXX=g++-${{ matrix.compiler_version }}" >> $GITHUB_ENV
          else
            if [[ "${{ matrix.cpp_standard }}" == "23" ]]; then
              sudo apt-get install -y clang-20
              echo "CXX=clang++-20" >> $GITHUB_ENV
            else
              sudo apt-get install -y clang
              echo "CXX=clang++" >> $GITHUB_ENV
            fi
          fi

      - name: Install clang-tidy
        run: sudo apt-get install -y clang-tidy

      - name: Clone GoogleTest (${{ matrix.gtest_ref }})
        run: |
          git clone https://github.com/google/googletest.git \
            -b ${{ matrix.gtest_ref }} googletest

      - name: Build and Install GoogleTest Locally
        run: |
          # GoogleTest 1.12.1 needs C++17 to build; others use matrix standard
          GT_BUILD_CXX_STANDARD="${{ matrix.cpp_standard }}"
          if [[ "${{ matrix.gtest_ref }}" == "release-1.12.1" ]]; then
            GT_BUILD_CXX_STANDARD="17"
          fi

          cmake -S googletest -B googletest/build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD="$GT_BUILD_CXX_STANDARD" \
            -DCMAKE_INSTALL_PREFIX="$HOME/gtest_install"

          cmake --build googletest/build
          cmake --install googletest/build
          echo "Installed GoogleTest under $HOME/gtest_install"

      - name: Configure and Build Project
        run: |
          cmake -S . -B build \
            -DCMAKE_CXX_COMPILER="$CXX" \
            -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
            -DCMAKE_PREFIX_PATH="$HOME/gtest_install" \
            -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -Dgtest_ct_build_tests=ON

          cmake --build build --verbose

      - name: Run clang-tidy analysis
        run: |
          for file in \
            include/gtest_ct.h \
            test/passing_tests/passing_tests.cpp; do
            clang-tidy "$file" -p build \
              -header-filter='^(?!.*\/googletest\/).*$' \
              -- -std=c++${{ matrix.cpp_standard }} \
                 -I"$HOME/gtest_install/include" \
                 -I"include" || true
          done

      - name: Show CTest test list
        run: cd build && ctest -N

      - name: Run All Tests via CTest
        run: cd build && ctest --output-on-failure -V -E "compilefail"
