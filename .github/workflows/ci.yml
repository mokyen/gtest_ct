name: CTest Complex Matrix Build

on:
  push:
    branches:
      - '*'       # Trigger on pushes to any branch
  pull_request:
    branches:
      - '*'       # Trigger on PRs targeting any branch

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        compiler: [g++, clang++]
        cpp_standard: [11, 14, 17, 20, 23]
        include:
          # C++11 → GoogleTest release-1.12.1 (last C++11-compatible)
          - compiler: g++
            cpp_standard: 11
            gtest_ref: release-1.12.1
          - compiler: clang++
            cpp_standard: 11
            gtest_ref: release-1.12.1

          # C++14 → GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 14
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 14
            gtest_ref: v1.14.0

          # C++17 → GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 17
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 17
            gtest_ref: v1.14.0

          # C++20 → GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 20
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 20
            gtest_ref: v1.14.0

          # C++23 → GoogleTest v1.14.0
          - compiler: g++
            cpp_standard: 23
            gtest_ref: v1.14.0
          - compiler: clang++
            cpp_standard: 23
            gtest_ref: v1.14.0

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install compiler (if needed)
        run: |
          if [ "${{ matrix.compiler }}" = "clang++" ]; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi

      - name: Clone GoogleTest (${{ matrix.gtest_ref }})
        run: |
          git clone https://github.com/google/googletest.git -b ${{ matrix.gtest_ref }} googletest

      - name: Build and Install GoogleTest Locally (no sudo prefix on install)
        run: |
          GT_BUILD_CXX_STANDARD="${{ matrix.cpp_standard }}"
          if [ "${{ matrix.gtest_ref }}" = "release-1.12.1" ]; then
            GT_BUILD_CXX_STANDARD="17"
          fi

          cmake -S googletest \
                -B googletest/build \
                -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
                -DCMAKE_CXX_STANDARD="$GT_BUILD_CXX_STANDARD" \
                -DCMAKE_INSTALL_PREFIX="$HOME/gtest_install"

          cmake --build googletest/build
          cmake --install googletest/build --prefix "$HOME/gtest_install"
          echo "Installed GoogleTest under $HOME/gtest_install"

      - name: Configure and Build Project (with C++ ${{ matrix.cpp_standard }} on ${{ matrix.compiler }})
        run: |
          cmake -S . -B build \
                -DCMAKE_CXX_COMPILER="${{ matrix.compiler }}" \
                -DCMAKE_CXX_STANDARD=${{ matrix.cpp_standard }} \
                -DCMAKE_PREFIX_PATH="$HOME/gtest_install" \
                -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=bin

          cmake --build build --verbose
          echo "Finished building project with ${{ matrix.compiler }} and C++${{ matrix.cpp_standard }}"

      - name: Show CTest test list (verbose, no compress)
        run: |
          cd build
          ctest -N --verbose --no-compress-output

      - name: Run All Tests via CTest (unit + compile-fail)
        run: |
          cd build
          # First run regular passing tests
          ctest --output-on-failure -V -E "compilefail|runtime"
          
          # Then run compile-fail tests (expected to fail compilation)
          ctest --output-on-failure -V -L compilefail || true
          
          # Finally run runtime-fail tests (expected to fail at runtime)
          ctest --output-on-failure -V -L runtime || true

      - name: Verify Test Results
        run: |
          cd build
          
          # Check if any unexpected failures occurred in passing tests
          ! ctest --output-on-failure -V -E "compilefail|runtime" 2>&1 | grep "Failed"
          
          # Verify compile-fail tests actually failed compilation
          ctest --output-on-failure -V -L compilefail 2>&1 | grep "Failed"
          
          # For runtime tests, capture output and verify specific failure message
          OUTPUT=$(ctest --output-on-failure -V -L runtime 2>&1)
          if ! echo "$OUTPUT" | grep -q "\[  FAILED  \] TUSpecificTests.ShouldFailAtRuntime"; then
            echo "Runtime test did not fail as expected"
            echo "$OUTPUT"
            exit 1
          fi
          if ! echo "$OUTPUT" | grep -q "gtest_ct failure: false"; then
            echo "Runtime test did not show expected failure message"
            echo "$OUTPUT"  
            exit 1
          fi

